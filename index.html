<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12a6c4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zain – Swirl Planet Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{
  --page:#efe7f2; --ink:#2b1233; --hint:#6f5b78;
  --teal:#12a6c4; --blue:#2b6cc0; --plum:#45103d; --magenta:#c8267f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#120c16; --ink:#f3e9f6; --hint:#a898af; }
}
:root[data-theme="dark"]{ --page:#120c16; --ink:#f3e9f6; --hint:#a898af; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; overscroll-behavior:none; }
body{ touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
body{
  margin:0; height:100%; background:var(--page); color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  overflow:hidden;
}
.phone{
  position:relative; aspect-ratio:375/780;
  width:min(390px, calc((100dvh - 84px) * 375 / 780), calc(100vw - 20px));
  border-radius:38px; background:#fff; overflow:hidden; isolation:isolate;
  box-shadow:0 0 0 8px #1b1420, 0 30px 60px rgba(30,0,40,.35);
  --k:0;
}
.screen{ position:absolute; inset:0; display:flex; flex-direction:column; background:#f6f4f8; transform-origin:50% 55%; }
svg.i{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* header */
.hdr{ background:linear-gradient(135deg,var(--teal),var(--blue)); color:#fff; padding:18px 18px 64px; position:relative; }
.hdr .logo{ font-weight:900; font-size:20px; letter-spacing:-.02em; }
.hdr .greet{ font-weight:700; font-size:16px; margin-top:2px; }
.hdr .num{ font-size:11px; opacity:.9; margin-top:2px; }
.bell{ position:absolute; right:16px; top:16px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; }
.bell svg{ width:15px; height:15px; }

/* balance */
.card{ margin:-46px 14px 0; border-radius:16px; padding:16px 16px 14px; color:#fff; position:relative;
  background:linear-gradient(135deg,#0e93b6,#173a80); box-shadow:0 10px 24px rgba(20,50,120,.25); }
.card small{ font-size:12px; opacity:.85; }
.card .amt{ font-size:26px; font-weight:900; letter-spacing:-.01em; margin:2px 0; }
.card .sub{ font-size:11px; opacity:.85; }
.card .meta{ font-size:12px; opacity:.9; margin-top:10px; }
.ringchart{ position:absolute; right:16px; top:50%; transform:translateY(-50%); width:62px; height:62px; }
.ringchart text{ fill:#fff; font-weight:800; font-size:13px; }

/* quick actions */
.actions{ display:flex; justify-content:space-between; padding:18px 22px 6px; }
.act{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#33203b; }
.act i{ width:44px; height:44px; border-radius:50%; background:#e2f4f8; display:grid; place-items:center; color:var(--teal); }

.banner{ margin:12px 14px 0; border-radius:14px; background:#fff2df; border:1px solid #f1d3a3; padding:12px; display:flex; align-items:center; gap:10px; }
.banner .bang{ width:24px; height:24px; border-radius:50%; background:#f5a623; color:#fff; font-weight:900; display:grid; place-items:center; font-size:14px; flex:none; }
.banner b{ display:block; font-size:13px; color:#7a4a05; }
.banner span{ font-size:11px; color:#a1712b; }
.banner .btn{ margin-left:auto; background:#f5a623; color:#fff; font-weight:800; font-size:13px; border-radius:20px; padding:8px 16px; }
.promo{ margin:12px 14px 0; border-radius:14px; padding:16px; color:#fff; background:linear-gradient(120deg,#d63fa0,#7d3fd0); }
.promo b{ display:block; font-size:17px; font-weight:900; }
.promo span{ font-size:12px; opacity:.9; }

/* bottom nav */
.nav{ position:absolute; left:0; right:0; bottom:0; height:72px; background:#fff; border-top:1px solid #ece6ef;
  display:grid; grid-template-columns:repeat(5,1fr); align-items:center; opacity:calc(1 - var(--k)); }
.ni{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:700; color:#8c8194; padding-top:6px; }
.ni.on{ color:var(--teal); }
.ni.l{ transform:translateX(calc(var(--k) * 34px)) scale(calc(1 - var(--k) * .5)); }
.ni.r{ transform:translateX(calc(var(--k) * -34px)) scale(calc(1 - var(--k) * .5)); }

/* space layer */
.space{ position:absolute; inset:0; z-index:5; pointer-events:none; }
.veil{ position:absolute; inset:0; opacity:0;
  background:
    radial-gradient(70% 45% at 50% 46%, rgba(50,10,45,.95) 0%, rgba(84,20,74,.9) 45%, rgba(150,28,112,.92) 80%, rgba(200,38,127,.95) 100%); }
.trail{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.trail path{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
.trail #logo path{ fill:#fff; }
.trail mask path{ stroke-linecap:butt; }

.zbtn{ position:absolute; left:0; top:0; width:64px; height:64px; border:0; padding:0; background:none; cursor:pointer; pointer-events:auto; z-index:4;
  will-change:transform; font-family:inherit; }
.zbtn:focus-visible{ outline:3px solid #fff; outline-offset:6px; border-radius:50%; }
.ball{ position:absolute; inset:0; border-radius:50%; z-index:1; overflow:hidden;
  background:
    radial-gradient(circle at 30% 24%, #8ff0ff 0%, #22b0cf 26%, #4d55b8 62%, #a3288f 100%);
  box-shadow:0 10px 22px rgba(120,30,140,.45), inset -7px -9px 16px rgba(45,10,80,.55), inset 4px 4px 10px rgba(255,255,255,.35), 0 0 0 3px rgba(255,255,255,.18); }
.ball::before{ content:""; position:absolute; left:-10%; right:-10%; top:46%; height:14%; background:rgba(255,255,255,.10); transform:rotate(-14deg); filter:blur(1px); }
.ball .shine{ position:absolute; left:14%; top:9%; width:34%; height:20%; border-radius:50%; background:radial-gradient(ellipse at 40% 40%, rgba(255,255,255,.85), rgba(255,255,255,0)); transform:rotate(-28deg); }
.ball .txt{ position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:900; font-size:16px; letter-spacing:-.03em; text-shadow:0 1px 4px rgba(50,0,80,.5); }
.ball .core{ display:none; }
.ball .core svg{ width:46px; height:46px; overflow:visible; }
.ringwrap{ position:absolute; left:50%; top:50%; width:98px; height:28px; margin:-14px 0 0 -49px; transform:rotate(-20deg); pointer-events:none; }
.ringwrap .ring{ width:100%; height:100%; border-radius:50%; border:2.5px solid rgba(232,110,190,.85); box-shadow:0 0 8px rgba(255,140,220,.55); }
.ringwrap.b{ z-index:0; }
.ringwrap.f{ z-index:2; }
.ringwrap.f .ring{ clip-path:inset(50% 0 0 0); }
.spark{ position:absolute; left:0; top:0; width:16px; height:16px; border-radius:50%; opacity:0; pointer-events:none; z-index:3; will-change:transform,opacity;
  background:radial-gradient(circle,#fff 0 38%,rgba(150,240,255,.95) 58%,rgba(255,60,214,0) 74%); box-shadow:0 0 8px 3px rgba(30,232,255,.4), 0 0 14px 6px rgba(255,43,214,.3); }
.moon{ position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff, #ffd6f0 50%, #e879c0); box-shadow:0 0 8px rgba(255,180,230,.9); pointer-events:none; }

.planet{ position:absolute; left:0; top:0; width:46px; height:46px; opacity:0; pointer-events:none; cursor:pointer; will-change:transform,opacity; border:0; padding:0; background:none; font-family:inherit; }
.space.open .planet{ pointer-events:auto; }
.space.open .veil{ pointer-events:auto; cursor:pointer; }
.planet:focus-visible{ outline:2px solid #fff; outline-offset:4px; border-radius:50%; }
.pball{ position:absolute; inset:0; border-radius:50%; z-index:1; display:grid; place-items:center; color:#fff;
  background:radial-gradient(circle at 30% 26%, var(--c1) 0%, var(--c2) 78%);
  box-shadow:0 6px 14px rgba(30,0,40,.45), inset -5px -6px 10px rgba(30,0,50,.4), inset 3px 3px 7px rgba(255,255,255,.4); }
.pball svg{ width:22px; height:22px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.plabel{ display:none; position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:5px; white-space:nowrap; font-size:10.5px; font-weight:800; color:#fff; background:rgba(48,8,52,.62); padding:2px 8px; border-radius:10px; }
.planet .ringwrap{ width:66px; height:18px; margin:-9px 0 0 -33px; transform:rotate(-24deg); }
.planet .ringwrap .ring{ border-width:2px; border-color:rgba(255,255,255,.75); box-shadow:none; }
.planet:active .pball{ filter:brightness(1.15); }

.toast{ position:absolute; left:50%; top:16px; transform:translate(-50%,-14px); background:rgba(255,255,255,.95); color:#3d1247; font-weight:800; font-size:12px; padding:8px 14px; border-radius:20px; opacity:0; transition:opacity .25s, transform .25s; z-index:9; pointer-events:none; white-space:nowrap; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- phones: the app fills the screen ---------- */
@media (max-width: 520px), (max-height: 520px) and (pointer: coarse){
  :root{ padding:0; }
  html,body{ height:100%; }
  body{ display:block; background:#f6f4f8; }
  .phone{ width:100vw; height:100vh; height:100dvh; aspect-ratio:auto; border-radius:0; box-shadow:none; }
  .hint{ display:none; }
  .hdr{ padding-top:calc(18px + env(safe-area-inset-top,0px)); }
  .bell{ top:calc(16px + env(safe-area-inset-top,0px)); }
  .nav{ height:calc(72px + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
  .toast{ top:calc(16px + env(safe-area-inset-top,0px)); }
}
/* landscape phones: keep the app column narrow and centred */
@media (min-width: 521px) and (max-height: 520px) and (pointer: coarse){
  .phone{ width:min(100vw,560px); margin:0 auto; }
  body{ background:#e9e3ee; }
}
/* short screens: let the app content scroll, nav stays at the bottom */
@media (max-height: 560px){
  .screen{ overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .screen > *{ flex:none; }
  .nav{ position:sticky; bottom:0; margin-top:auto; }
}
@media (max-height: 700px){
  .hdr{ padding-bottom:54px; }
  .actions{ padding-top:12px; padding-bottom:0; }
  .banner,.promo{ margin-top:8px; }
  .promo{ padding:12px 16px; }
  .card{ padding:12px 16px 10px; }
}
@media (max-height: 600px){
  .hdr .greet{ font-size:14px; }
  .card .amt{ font-size:22px; }
  .card .meta{ margin-top:6px; }
}
.hint{ font-size:13px; color:var(--hint); font-weight:700; margin:0; }
</style>
</head>

  function dash(len){ return Math.max(len,0).toFixed(2)+' 100000'; }

  function frame(now){
    var dt = last ? Math.min(now-last, 50) : 16; last = now;

    if(q !== target){
      var dur = target > q ? DUR_OPEN : DUR_CLOSE;
      q += (target > q ? 1 : -1) * dt/dur;
      if((target>0 && q>=1) || (target===0 && q<=0)){ q = target; if(target){ space.classList.add('open'); showToast('Tap anywhere to close'); } }
    }
    var e = ease(q), head = e*L;

    // button rides the path
    var pt = pathRef.getPointAtLength(head);
    zbtn.style.transform = 'translate3d('+(pt.x-32).toFixed(2)+'px,'+(pt.y-32).toFixed(2)+'px,0)';
    // the Zain planet dissolves once the swirl is fully drawn, and returns when the menu closes
    if(target){ bo = 1 - smooth(E, E+0.16*Lsp, head); }
    else { bo = clamp(bo + (q<=0 ? 1 : -1)*dt/260, 0, 1); }
    zbtn.style.opacity = bo.toFixed(3);
    zbtn.style.visibility = bo<0.01 ? 'hidden' : 'visible';
    zbtn.style.pointerEvents = bo>0.6 ? 'auto' : 'none';
    // a glowing tip keeps drawing the swirl once the Zain planet is gone
    spark.style.opacity = ((1-bo) * smooth(0,0.05,q) * (1-smooth(0.94,1,q))).toFixed(3);
    spark.style.transform = 'translate3d('+(pt.x-8).toFixed(2)+'px,'+(pt.y-8).toFixed(2)+'px,0)';
    // the "zain" label spins only while the swirl is being drawn: a whole number of turns, so it ends upright and still
    rot = reduce ? 0 : (head/L) * 7 * Math.PI * 2;
    ztxt.style.transform = 'rotate('+rot.toFixed(4)+'rad)';

    // moon
    if(!reduce){
      var tt = now/1000*1.3, mx = 49*Math.cos(tt), my = 14*Math.sin(tt), ca=Math.cos(-0.35), sa=Math.sin(-0.35);
      moon.style.transform = 'translate('+(mx*ca-my*sa).toFixed(2)+'px,'+(mx*sa+my*ca).toFixed(2)+'px)';
      moon.style.zIndex = Math.sin(tt) > 0 ? 3 : 0;
    }

    // the swirl draws itself behind the button
    mMain.style.strokeDasharray = dash((head-E)/sc);
    var relSp = head - E;
    mTail.style.strokeDasharray = dash(LtL*smooth(E, E+0.28*Lsp, head));
    mCres.style.strokeDasharray = dash(LcL*smooth(E+0.04*Lsp, E+0.40*Lsp, head));

    var run = Math.max(0, head-E);
    pathGlow.style.strokeDasharray = '0 '+E.toFixed(1)+' '+run.toFixed(1)+' 100000';
    pathGlow.style.opacity = 0.14*smooth(0,30,run);
    pathEntry.style.strokeDasharray = Math.max(0,Math.min(head,E)-1).toFixed(1)+' 100000';
    pathEntry.style.opacity = 0;

    // planets ride the swirl and settle on it
    var bob = smooth(0.96,1,q);
    for(var j=0;j<planets.length;j++){
      var rn = head - LAG[j];
      var p = planets[j];
      if(rn <= 0){ p.style.opacity = 0; continue; }
      var s = clamp(rn, 0, S[j]);
      var drift = reduce ? 0 : Math.sin(now/900 + j*1.4)*9*bob;
      var pp = pos(s+drift);
      var scl = 0.35 + 0.65*smooth(0,110,rn);
      p.style.opacity = (0.84*smooth(0,40,rn)).toFixed(3);
      p.style.transform = 'translate3d('+(pp.x-23).toFixed(2)+'px,'+(pp.y-23).toFixed(2)+'px,0) scale('+scl.toFixed(3)+')';
    }

    // scene
    veil.style.opacity = smooth(0,0.25,q);
    var k = clamp(q*3.2,0,1);
    phone.style.setProperty('--k', k.toFixed(3));
    screen.style.transform = 'scale('+(1-0.05*e).toFixed(3)+')';
    screen.style.filter = e>0.01 ? 'blur('+(e*1.4).toFixed(2)+'px)' : 'none';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
